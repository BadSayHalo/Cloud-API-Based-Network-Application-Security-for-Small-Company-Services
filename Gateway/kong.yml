# ==========================================
# 2. CẤU HÌNH DỊCH VỤ VÀ GẮN HỘ CHIẾU
# ==========================================
services:
  - name: order-service-backend
    url: https://backend-order-api:3000 # THAY ĐỔI 1: Sửa http thành https
    client_certificate:
      id: "c90a1e0b-d242-43bb-a982-f5c719e71ab8"       # THAY ĐỔI 2: Ép Kong phải dùng hộ chiếu khi gọi Node.js
    routes:
      - name: fetch-orders
        paths:
          - /api/v1/orders
        strip_path: false

# =========
plugins:
  - name: rate-limiting
    config:
      minute: 10
      policy: local
  
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600

  # KÍCH HOẠT PLUGIN JWT (Kiểm soát bởi Keycloak)
  - name: jwt
    config:
      claims_to_verify:
        - exp

consumers:
  # KHAI BÁO KEYCLOAK LÀ BÊN CẤP PHÁT DUY NHẤT
  - username: "keycloak-issuer"
    jwt_secrets:
      - key: "http://keycloak-idp:8080/realms/laptop-store" 
        algorithm: ES256 
        rsa_public_key: |
