_format_version: "3.0"
 
services:
  # ==========================================
  # 1. ORDER-SERVICE BACKEND
  # ==========================================
  - name: order-service-backend
    url: https://backend-order-api:3000
    routes:
      - name: fetch-orders
        paths:
          - /api/v1/orders
          - /api/v1/admin
          - /api/v1/profile 
        strip_path: false
        plugins:
          - name: request-size-limiting
            config:
              allowed_payload_size: 1
 
          - name: pre-function
            config:
              access:
                - |
                  ngx.req.read_body()
                  local req_body = ngx.req.get_body_data() or ""
                  local req_uri  = ngx.var.request_uri      or ""
                  local check_target = string.upper(req_body .. " " .. req_uri)
 
                  local patterns = {
                    "OR%s+1=1", "UNION%s+SELECT", "DROP%s+TABLE", 
                    "<SCRIPT", "ALERT%s*%(", "%.%./", "169%.254%.169%.254"
                  }
 
                  for _, pattern in ipairs(patterns) do
                    if string.find(check_target, pattern) then
                      ngx.status = 403
                      ngx.header.content_type = "application/json"
                      ngx.header["X-Kong-Block-Reason"] = "WAF_ATTACK_DETECTED"
                      ngx.say('{"error": "WAF: Phat hien hanh vi tan cong!"}')
                      return ngx.exit(ngx.status)
                    end
                  end
 
          - name: jwt
            config:
              claims_to_verify:
                - exp
 
          - name: rate-limiting
            config:
              minute: 20
              policy: local
 
      # --- Webhook route ---
      - name: payment-webhook
        paths:
          - /api/v1/webhook
        strip_path: false
        plugins:
          - name: hmac-auth
            config:
              enforce_headers:
                - date
                - request-line
              algorithms:
                - hmac-sha256
 
          - name: rate-limiting
            config:
              minute: 60
              policy: local
 
          - name: request-size-limiting
            config:
              allowed_payload_size: 1
 
          - name: pre-function
            config:
              access:
                - |
                  ngx.req.read_body()
                  local req_body = ngx.req.get_body_data() or ""
                  local req_uri  = ngx.var.request_uri      or ""
                  local check_target = string.upper(req_body .. " " .. req_uri)
                  local patterns = {
                    "OR%s+1=1", "UNION%s+SELECT", "DROP%s+TABLE",
                    "<SCRIPT", "ALERT%s*%(", "%.%./", "169%.254%.169%.254"
                  }
                  for _, pattern in ipairs(patterns) do
                    if string.find(check_target, pattern) then
                      ngx.status = 403
                      ngx.header.content_type = "application/json"
                      ngx.header["X-Kong-Block-Reason"] = "WAF_WEBHOOK_ATTACK"
                      ngx.say('{"error": "WAF: Webhook Payload chua ma doc!"}')
                      return ngx.exit(ngx.status)
                    end
                  end
 
  # ==========================================
  # 2. PRODUCT-SERVICE (public catalog)
  # ==========================================
  - name: product-service-backend
    url: https://backend-product-api:3001
    routes:
      - name: fetch-products
        paths:
          - /api/v1/products
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: local
 
  # ==========================================
  # 3. KEYCLOAK (ĐÃ SỬA THEO COMPOSE)
  # ==========================================
  - name: keycloak-service
    url: http://keycloak-idp:8080
    routes:
      - name: keycloak-login-api
        paths:
          - /realms/laptop-store/protocol/openid-connect/token
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 5
              policy: local
 
      - name: keycloak-auth-route
        paths:
          - /realms
          - /resources
          - /js
        strip_path: false
 
  # ==========================================
  # 4. FRONTEND
  # ==========================================
  - name: frontend-service
    url: http://frontend-web:80
    routes:
      - name: frontend-route
        paths:
          - /
        strip_path: false
 
# ==========================================
# GLOBAL PLUGINS
# ==========================================
plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:4000"
        - "http://localhost:8000"
        - "https://localhost:8443" # Thêm URL HTTPS của Kong vào CORS
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600
 
  - name: http-log
    config:
      http_endpoint: "http://logstash:5044" # Container name và port chuẩn theo compose
      method: "POST"
      timeout: 3000
      keepalive: 1000
      flush_timeout: 2
      retry_count: 3
 
consumers:
  - username: "keycloak-issuer"
    jwt_secrets:
      - key: "http://localhost:8443/realms/laptop-store"
        algorithm: ES256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAESyniahnHumHiGzbUXyFpicO8PX74
          YaXQLTJfDOV7ga2DlnbgX5oP7bkvDGEiq0T1ImtarQgL2dZJY5y4G0Y77w==
          -----END PUBLIC KEY-----
 
  - username: "vnpay-partner"
    hmacauth_credentials:
      - username: "vnpay-partner"
        secret: "${KONG_VNPAY_SECRET}"