_format_version: "3.0"

services:
  # ==========================================
  # 1. SERVICE BACKEND (CẦN BẢO VỆ NGHIÊM NGẶT)
  # ==========================================
  - name: order-service-backend
    url: https://backend-order-api:3000
    routes:
      - name: fetch-orders
        paths:
          - /api/v1/orders
          - /api/v1/admin
        strip_path: false
        
        # NHỐT PLUGIN WAF VÀ JWT VÀO ĐÂY, CHỈ ÁP DỤNG CHO ĐƠN HÀNG
        plugins:
          - name: pre-function
            config:
              access:
                - |
                  ngx.req.read_body()
                  local req_body = ngx.req.get_body_data()
                  if req_body then
                    local patterns = {"OR%s+1=1", "UNION%s+SELECT", "DROP%s+TABLE", "<SCRIPT", "ALERT%s*%("}
                    for _, pattern in ipairs(patterns) do
                      if string.find(string.upper(req_body), pattern) then
                        ngx.status = 403
                        ngx.header.content_type = "application/json"
                        ngx.say('{"error": "WAF: Phat hien hanh vi tan cong!"}')
                        return ngx.exit(ngx.status)
                      end
                    end
                  end
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: rate-limiting
            config:
              minute: 20
              policy: local

      - name: payment-webhook
        paths:
          - /api/v1/webhook
        strip_path: false
        plugins:
          - name: hmac-auth
            config:
              enforce_headers:
                - date
                - request-line # Hoặc các header bạn cấu hình bên mock-vnpay
              algorithms:
                - hmac-sha256

          # 1. Chống Spam: Webhook không thể gọi điên cuồng được, giới hạn 60 lần/phút
          - name: rate-limiting
            config:
              minute: 60
              policy: local
              
          # 2. Cân nhắc thêm WAF: Tái sử dụng lại đoạn code chống SQLi/XSS
          - name: pre-function
            config:
              access:
                - |
                  ngx.req.read_body()
                  local req_body = ngx.req.get_body_data()
                  if req_body then
                    local patterns = {"OR%s+1=1", "UNION%s+SELECT", "DROP%s+TABLE", "<SCRIPT", "ALERT%s*%("}
                    for _, pattern in ipairs(patterns) do
                      if string.find(string.upper(req_body), pattern) then
                        ngx.status = 403
                        ngx.header.content_type = "application/json"
                        ngx.say('{"error": "WAF: Webhook Payload chua ma doc!"}')
                        return ngx.exit(ngx.status)
                      end
                    end
                  end

  # ==========================================
  # SERVICE PRODUCT (MỞ CỬA CHO KHÁCH XEM)
  # ==========================================
  - name: product-service-backend
    url: https://backend-product-api:3001 # Phải là HTTPS vì code dùng https.createServer
    routes:
      - name: fetch-products
        paths:
          - /api/v1/products
        strip_path: false
    # KHÔNG GẮN plugin JWT vào đây để khách xem hàng tự do
    # KHÔNG GẮN plugin pre-function (WAF) vì đây chỉ là hàm GET

  # ==========================================
  # 2. SERVICE KEYCLOAK (MỞ CỬA CHO ĐĂNG NHẬP)
  # ==========================================
  - name: keycloak-service
    url: http://keycloak:8080
    routes:
      # --- ĐƯỜNG A: ĐĂNG NHẬP / XIN TOKEN ---
      - name: keycloak-login-api
        paths:
          - /realms/laptop-store/protocol/openid-connect/token
        strip_path: false
        plugins:
          - name: rate-limiting # CHỐNG BRUTE-FORCE: Chỉ cho gọi API đăng nhập 5 lần/phút
            config:
              minute: 5
              policy: local

      # --- ĐƯỜNG B: TẢI GIAO DIỆN WEB ---
      - name: keycloak-auth-route
        paths:
          - /realms
          - /resources
          - /js
        strip_path: false

  - name: frontend-service
    url: http://frontend-web:80
    routes:
      - name: frontend-route
        paths:
          - /    # Bất cứ link nào không phải API sẽ được đẩy về Web giao diện
        strip_path: false

# ==========================================
# 3. GLOBAL PLUGINS (ÁP DỤNG CHO TẤT CẢ)
# ==========================================
plugins:

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600

consumers:
  - username: "keycloak-issuer"
    jwt_secrets:
      - key: "http://localhost:8443/realms/laptop-store" # Đổi 8080 thành 8000 vì giờ Kong nhận diện Keycloak qua cổng 8000
        algorithm: ES256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAESyniahnHumHiGzbUXyFpicO8PX74
          YaXQLTJfDOV7ga2DlnbgX5oP7bkvDGEiq0T1ImtarQgL2dZJY5y4G0Y77w==
          -----END PUBLIC KEY-----
      
  - username: "frontend-app"
    hmacauth_credentials:
      - username: "client-id"   # Client sẽ gửi cái này trong header
        secret: "bi-mat-sieu-cap-vjp"