services:
  - name: order-service-backend
    url: https://backend-order-api:3000 # THAY ĐỔI 1: Sửa http thành https
    client_certificate:
      id: "c90a1e0b-d242-43bb-a982-f5c719e71ab8"       # THAY ĐỔI 2: Ép Kong phải dùng hộ chiếu khi gọi Node.js
    routes:
      - name: fetch-orders
        paths:
          - /api/v1/orders
          - /api/v1/admin
        strip_path: false

# =========
plugins:
  - name: rate-limiting
    config:
      minute: 10
      policy: local
  
  - name: pre-function
    config:
      access:
        - |
          local req_body = ngx.req.get_body_data()
          if req_body then
            -- Quét các từ khóa tấn công cơ bản (SQLi, XSS)
            local patterns = {"OR%s+1=1", "UNION%s+SELECT", "DROP%s+TABLE", "<SCRIPT>", "ALERT%("}
            for _, pattern in ipairs(patterns) do
              if string.find(string.upper(req_body), pattern) then
                ngx.status = 403
                ngx.header.content_type = "application/json"
                ngx.say('{"error": "WAF: Phát hiện hành vi tấn công nguy hiểm!"}')
                return ngx.exit(ngx.status)
              end
            end
          end

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600

  # KÍCH HOẠT PLUGIN JWT (Kiểm soát bởi Keycloak)
  - name: jwt
    config:
      claims_to_verify:
        - exp

consumers:
  # KHAI BÁO KEYCLOAK LÀ BÊN CẤP PHÁT DUY NHẤT
  - username: "keycloak-issuer"
    jwt_secrets:
