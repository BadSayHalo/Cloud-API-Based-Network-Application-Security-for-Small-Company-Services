name: CI/CD Security Pipeline (Hardened Copy)

on:
  push:
    branches: ["main", "FullSystem", "Final"]
  pull_request:
    branches: ["main", "FullSystem", "Final"]
  workflow_dispatch:

# Least privilege at workflow level
permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@300016a338b37b9a9ede7925195b5a5368db4c84 # v3.63.5
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  sast-and-sca:
    name: SAST + Dependency Audit
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: 'services/**/package-lock.json'

      - name: Verify lockfiles exist
        run: |
          test -f services/order-service/package-lock.json
          test -f services/product-service/package-lock.json
          test -f services/mock-vnpay/package-lock.json

      - name: Install order-service dependencies
        run: |
          cd services/order-service
          npm ci

      - name: NPM Audit - order-service
        run: |
          cd services/order-service
          npm audit --audit-level=high --json > /tmp/audit-order.json
          cat /tmp/audit-order.json

      - name: Install product-service dependencies
        run: |
          cd services/product-service
          npm ci

      - name: NPM Audit - product-service
        run: |
          cd services/product-service
          npm audit --audit-level=high --json > /tmp/audit-product.json || true
          cat /tmp/audit-product.json

      - name: Install mock-vnpay dependencies
        run: |
          cd services/mock-vnpay
          npm ci

      - name: NPM Audit - mock-vnpay
        run: |
          cd services/mock-vnpay
          npm audit --audit-level=high --json > /tmp/audit-vnpay.json || true
          cat /tmp/audit-vnpay.json

      - name: SAST - Semgrep
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/nodejs
            p/owasp-top-ten
            p/secrets

      - name: Upload Audit Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-audit-reports
          path: |
            /tmp/audit-order.json
            /tmp/audit-product.json
            /tmp/audit-vnpay.json
          retention-days: 30

  build-and-image-scan:
    name: Build & Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: sast-and-sca
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker Image - order-service
        run: |
          cd services/order-service
          docker build -t capstone-order:latest .

      - name: Trivy Scan - order-service (Export JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: capstone-order:latest
          format: json
          output: /tmp/trivy-order.json
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Trivy Scan - order-service (Break Pipeline)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: capstone-order:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Build Docker Image - product-service
        if: always()
        run: |
          cd services/product-service
          docker build -t capstone-product:latest .

      - name: Trivy Scan - product-service (Export JSON)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: capstone-product:latest
          format: json
          output: /tmp/trivy-product.json
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Trivy Scan - product-service (Break Pipeline)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: capstone-product:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-scan-reports
          path: |
            /tmp/trivy-order.json
            /tmp/trivy-product.json
          retention-days: 30