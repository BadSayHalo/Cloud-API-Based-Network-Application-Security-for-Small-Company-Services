<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận Thanh Toán</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
            border-top: 5px solid #007bff;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .amount-box {
            background: #e9ecef;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .amount {
            font-size: 32px;
            color: #dc3545;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-confirm {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-confirm:hover { background: #0056b3; }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #6c757d;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: #343a40; }
        #loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h2>Xác nhận Đơn hàng</h2>
        
        <div class="amount-box">
            <div style="color: #666; margin-bottom: 5px;">Mã đơn hàng: <strong id="lblOrderId" style="color:#333;">---</strong></div>
            <div style="color: #666;">Tổng thanh toán:</div>
            <div class="amount" id="lblAmount">0 đ</div>
        </div>

        <button class="btn-confirm" id="btnConfirm" onclick="initiatePayment()">Tạo Link Thanh Toán (VNPay)</button>
        <div id="loader"></div>
        <p id="errorMsg" style="color: #dc3545; font-weight: bold; margin-top: 15px; display: none;"></p>

        <a href="/" class="back-link">Quay lại cửa hàng</a>
    </div>

    <script>
        // 1. Lấy thông tin từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        const amount = urlParams.get('amount');

        if (!orderId || !amount) {
            document.getElementById('errorMsg').innerText = "Thiếu thông tin đơn hàng!";
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('btnConfirm').disabled = true;
        } else {
            document.getElementById('lblOrderId').innerText = "#" + orderId;
            document.getElementById('lblAmount').innerText = parseInt(amount).toLocaleString('vi-VN') + " đ";
        }

        // 2. Gọi API để lấy URL của VNPay
        async function initiatePayment() {
            document.getElementById('btnConfirm').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';

            try {
                // Gọi API thông qua Kong Gateway
                const response = await fetch("https://longle24520999.kesug.com/api/v1/payment/create", {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('accessToken') // Lấy token từ local storage
                    },
                    body: JSON.stringify({ order_id: orderId, amount: amount })
                });

                const data = await response.json();

                if (response.ok && data.checkout_url) {
                    // Chuyển hướng người dùng sang trang của VNPay (mock-vnpay:4001)
                    window.location.href = data.checkout_url;
                } else {
                    throw new Error(data.error || "Lỗi tạo phiên thanh toán");
                }
            } catch (err) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('btnConfirm').style.display = 'block';
                document.getElementById('errorMsg').innerText = "" + err.message;
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>

</body>
</html>
