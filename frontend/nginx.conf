server {
    listen 80;
    server_name localhost;

    # THÊM DÒNG NÀY ĐỂ GIỮ NGUYÊN CỔNG 4000
    absolute_redirect off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /admin {
        alias /usr/share/nginx/html/;
        index admin.html;
        # Sửa một chút ở try_files để chuẩn hơn cho alias
        try_files $uri $uri/ /admin.html;
    }
}