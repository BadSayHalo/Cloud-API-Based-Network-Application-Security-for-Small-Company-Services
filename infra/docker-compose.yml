services:
  # 1. API GATEWAY
  kong:
    image: kong:3.4-ubuntu
    container_name: kong-api
    volumes:
      - ../gateway/kong.yml:/usr/local/kong/declarative/kong.yml
      - ../certs:/certs
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_DECLARATIVE_CONFIG_STRING_INTERPOLATION: "true"
      KONG_VNPAY_SECRET: ${KONG_VNPAY_SECRET}
      # CẬP NHẬT 1: Báo cho Kong biết phải lắng nghe thêm cổng 8443 có bọc SSL
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      # CẬP NHẬT 2: Trỏ thẳng chứng chỉ ECC (mTLS) của Kong vào để nó làm SSL Termination
      KONG_SSL_CERT: /certs/kong-bundle.crt
      KONG_SSL_CERT_KEY: /certs/kong.key

      KONG_CLIENT_SSL: "on"
      KONG_CLIENT_SSL_CERT: /certs/kong-bundle.crt
      KONG_CLIENT_SSL_CERT_KEY: /certs/kong.key
    ports:
      - "8000:8000"
      - "8443:8443" # CẬP NHẬT 3: Mở cổng HTTPS ra ngoài máy Host
      - "127.0.0.1:8001:8001"
    networks:
      - capstone-net

  #2. FRONTEND WEB
  frontend-web:
    build: 
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend-web
    networks:
      - capstone-net
    depends_on:
      - kong


  # 3. BACKEND SERVICE
  order-service:
    build: ../services/order-service
    container_name: backend-order-api
    #ports:
    #  - "3000:3000"
    expose:
      - "3000"
    environment:
      PORT: 3000
      VAULT_ADDR: "https://vault-server:8200"
      #VAULT_TOKEN: "my-root-token"
      #WEBHOOK_SECRET: "day-la-key-sieu-bao-mat-moi" # Dùng cho HMAC
    depends_on:
      - vault
    volumes:
      - ../certs:/app/certs
      - vault-token-share:/app/vault-token-share
    networks:
      - capstone-net

  product-service:
    build: ../services/product-service
    container_name: backend-product-api
    expose:
      - "3001"
    environment:
      PORT: 3001
      VAULT_ADDR: "https://vault-server:8200"
      #DATABASE_URL: ${DATABASE_URL} # Nếu dùng Vault thì có thể bỏ dòng này trong Compose
    volumes:
      - ../certs:/app/certs
      - vault-token-share:/app/vault-token-share # Quan trọng: Để lấy token từ Vault Agent
    networks:
      - capstone-net
    depends_on:
      - vault

  # ==========================================
  # 7. MOCK PAYMENT GATEWAY (GIẢ LẬP VNPAY)
  # ==========================================
  mock-vnpay:
    build: ../services/mock-vnpay
    container_name: mock-vnpay
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      WEBHOOK_SECRET: ${VNPAY_WEBHOOK_SECRET}
      KONG_USERNAME: ${KONG_VNPAY_USERNAME}
      KONG_SECRET: ${KONG_VNPAY_SECRET}
      KONG_WEBHOOK_URL: ${KONG_WEBHOOK_URL}
    volumes:
      - ../certs:/app/certs:ro
    networks:
      - capstone-net

  # 4. IDENTITY PROVIDER (KEYCLOAK)
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: keycloak-idp
    command: start-dev --import-realm 
    environment:
      KC_PROXY: edge
      # CẬP NHẬT 1: Ép các đường link Keycloak tạo ra (như link Login) phải dùng HTTPS cổng 8443 của Kong
      KC_HOSTNAME_URL: https://localhost:8443
      KC_HOSTNAME_ADMIN_URL: http://localhost:8080
      # CẬP NHẬT 2: Bảo mật tài khoản Admin bằng cách đọc từ file .env
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
       - "127.0.0.1:8080:8080" # Chỉ expose cổng 8080 ra localhost
    volumes:
      - ./realm-full.json:/opt/keycloak/data/import/realm.json
    networks:
      - capstone-net

  # 4. SECRET MANAGEMENT (VAULT)
  consul:
    image: hashicorp/consul:1.15
    container_name: consul-storage
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    volumes:
      - consul-data:/consul/data
    ports:
      - "127.0.0.1:8500:8500"
    networks:
      - capstone-net

  # 5. VAULT - Két sắt (Chạy chế độ Server Mode)
  vault:
    image: hashicorp/vault:1.13
    container_name: vault-server
    user: root
    #ports:
    #  - "8200:8200"
    expose:
      - "8200"
    volumes:
      - ./vault-config.hcl:/vault/config/vault-config.hcl:ro
      - ../certs:/vault/certs:ro
    # Chạy lệnh server với file cấu hình thay vì dev mode
    command: vault server -config=/vault/config/vault-config.hcl
    cap_add:
      - IPC_LOCK
    depends_on:
      - consul
    networks:
      - capstone-net

  # 6. VAULT AGENT - Ông thư ký (Giữ nguyên, chỉ cần khớp networks)
  vault-agent:
    image: hashicorp/vault:1.13
    container_name: vault-agent
    user: root
    volumes:
      # 1. Mount file cấu hình Agent
      - ./vault-agent.hcl:/etc/vault/agent.hcl:ro
      # 2. Mount thư mục chứa ID (Đổi đường dẫn để tránh xung đột)
      - ./.vault-ids:/etc/vault-ids:ro
      # 3. Mount thư mục chứng chỉ để Agent xác minh HTTPS của Vault Server
      - ../certs:/vault/certs:rw
      # 4. Thư mục chia sẻ Token với Node.js
      - vault-token-share:/app/vault-token-share
    command: sh -c "mkdir -p /app/vault-token-share && vault agent -config=/etc/vault/agent.hcl"
    depends_on:
      - vault
    networks:
      - capstone-net

    # ==========================================
  # ELK STACK (LOGGING & MONITORING)
  # ==========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Tắt xác thực để demo cho nhanh
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Giới hạn RAM
    #ports:
    #  - "9200:9200"
    expose:
      - "9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    networks:
      - capstone-net  

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.1
    container_name: logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ../certs:/certs:ro
    #ports:
    #  - "5044:5044"
    expose:
      - "5044"
    depends_on:
      - elasticsearch
    networks:
      - capstone-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: kibana
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      # 👇 THÊM 3 DÒNG NÀY ĐỂ BẬT HTTPS
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=/certs/kong-bundle.crt
      - SERVER_SSL_KEY=/certs/kong.key
    volumes:
      - ../certs:/certs:ro
    depends_on:
      - elasticsearch
    networks:
      - capstone-net

networks:
  capstone-net:
    driver: bridge

volumes:
  consul-data:       # Lưu trữ dữ liệu Consul xuống ổ cứng
  vault-token-share: # Chia sẻ Token giữa Agent và Backend
  elastic-data:      # Lưu trữ dữ liệu Elasticsearch xuống ổ cứng