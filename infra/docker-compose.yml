services:
  # 1. API GATEWAY
  kong:
    image: kong:3.4-ubuntu
    container_name: kong-api
    volumes:
      - ../gateway/kong.yml:/usr/local/kong/declarative/kong.yml
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - capstone-net

  frontend-web:
    build: ../frontend
    container_name: frontend-web
    ports:
      - "4000:80"
    networks:
      - capstone-net


  # 2. BACKEND SERVICE
  order-service:
    build: ../services/order-service
    container_name: backend-order-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      VAULT_ADDR: "http://vault-server:8200"
      VAULT_TOKEN: "my-root-token"
      WEBHOOK_SECRET: "super-secret-webhook-key" # Dùng cho HMAC
    depends_on:
      - vault
    volumes:
      - ../certs:/app/certs
      - vault-token-share:/app/vault-token-share
    networks:
      - capstone-net

  # 3. IDENTITY PROVIDER (KEYCLOAK)
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: keycloak-idp
    command: start-dev --import-realm 
    environment:
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./realm-full.json:/opt/keycloak/data/import/realm.json
    networks:
      - capstone-net

  # 4. SECRET MANAGEMENT (VAULT)
  consul:
    image: hashicorp/consul:1.15
    container_name: consul-storage
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    volumes:
      - consul-data:/consul/data
    ports:
      - "8500:8500"
    networks:
      - capstone-net

  # 2. VAULT - Két sắt (Chạy chế độ Server Mode)
  vault:
    image: hashicorp/vault:1.13
    container_name: vault-server
    user: root
    ports:
      - "8200:8200"
    volumes:
      - ./vault-config.hcl:/vault/config/vault-config.hcl:ro
    # Chạy lệnh server với file cấu hình thay vì dev mode
    command: vault server -config=/vault/config/vault-config.hcl
    cap_add:
      - IPC_LOCK
    depends_on:
      - consul
    networks:
      - capstone-net

  # 3. VAULT AGENT - Ông thư ký (Giữ nguyên, chỉ cần khớp networks)
  vault-agent:
    image: hashicorp/vault:1.13
    container_name: vault-agent
    user: root
    volumes:
      - ./vault-agent.hcl:/etc/vault/agent.hcl
      - vault-token-share:/app/vault-token-share
      - ./.vault-ids:/etc/vault
    command: sh -c "mkdir -p /app/vault-token-share && vault agent -config=/etc/vault/agent.hcl"
    depends_on:
      - vault
    networks:
      - capstone-net

networks:
  capstone-net:
    driver: bridge

volumes:
  consul-data:       # Lưu trữ dữ liệu Consul xuống ổ cứng
  vault-token-share: # Chia sẻ Token giữa Agent và Backend