services:
  # 1. API GATEWAY (KONG CHẾ ĐỘ DB-LESS - NHẸ VÀ NHANH)
  kong:
    image: kong:3.4-ubuntu
    container_name: kong-api
    volumes:
      # Ánh xạ file kong.yml từ thư mục gateway vào trong Kong
      - ../gateway/kong.yml:/usr/local/kong/declarative/kong.yml
    environment:
      KONG_DATABASE: "off" # Tắt database của Kong
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - capstone-net

  frontend-web:
    build: ../frontend
    container_name: frontend-web
    ports:
      - "4000:80"
    networks:
      - capstone-net
      
  admin-web:
    build: ../admin-frontend
    container_name: admin-web
    ports:
      - "4001:80" # Cổng 6000 dành riêng cho Admin
    networks:
      - capstone-net

  # 2. CƠ SỞ DỮ LIỆU CỦA ỨNG DỤNG (LAPTOP STORE)
  app-database:
    image: postgres:17
    container_name: app-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_db_password
      POSTGRES_DB: laptop_store
    ports:
      - "5432:5432"
    volumes:
      # Nạp thẳng file schema.sql từ thư mục infra vào để tự tạo bảng
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - capstone-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. BACKEND SERVICE (ORDER SERVICE NODE.JS)
  order-service:
    build: ../services/order-service
    container_name: backend-order-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      ENCRYPTION_KEY: ${ENCRYPTION_KEY} 
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ../certs:/app/certs
    networks:
      - capstone-net

  # 4. IDENTITY PROVIDER (KEYCLOAK)
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: keycloak-idp
    # THAY ĐỔI 1: Thêm cờ --import-realm để nó tự đọc file khi khởi động
    command: start-dev --import-realm 
    environment:
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    # THAY ĐỔI 2: Gắn file JSON từ máy Windows vào "hòm thư" bí mật của Keycloak
    volumes:
      - ./realm-full.json:/opt/keycloak/data/import/realm.json
    networks:
      - capstone-net

networks:
  capstone-net:
    driver: bridge

  
